<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公益节点分享</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1f2937, #111827);
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 sm:p-6">

    <div class="max-w-2xl w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>公益免费节点 · 节点运行中</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                HK-CF-ECH | 自动优选
            </h1>
            <p class="text-xs sm:text-sm text-slate-400">基于 Cloudflare & ECH 加密的安全高速连接</p>
        </div>

        <!-- Main Card -->
        <div class="glass-card rounded-2xl p-6 shadow-2xl space-y-6">
            
            <!-- Key Details Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs sm:text-sm">
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">协议类型</div>
                    <div class="font-semibold text-emerald-400 flex items-center gap-1.5">
                        <i class="fa-solid font-mono text-xs">⚡</i> VLESS
                    </div>
                </div>
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">传输协议</div>
                    <div class="font-semibold text-slate-200">WebSocket</div>
                </div>
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">安全加密</div>
                    <div class="font-semibold text-sky-400 flex items-center gap-1">
                        <i class="fa-solid fa-lock text-xs"></i> TLS + ECH
                    </div>
                </div>
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">地址/端口</div>
                    <div class="font-semibold text-slate-200 truncate" title="saas.sin.fan:2087">saas.sin.fan:2087</div>
                </div>
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">伪装域名 (SNI)</div>
                    <div class="font-semibold text-slate-200 truncate" title="hk.ainio.cc.cd">hk.ainio.cc.cd</div>
                </div>
                <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                    <div class="text-slate-400 text-xs mb-1">ALPN</div>
                    <div class="font-semibold text-slate-200 truncate">h2, http/1.1</div>
                </div>
            </div>

            <!-- Vless Link Output & Copy -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-slate-400 flex justify-between items-center">
                    <span>节点链接 (URI)</span>
                    <span id="copy-status" class="text-emerald-400 text-xs hidden">已复制到剪贴板！</span>
                </label>
                <div class="relative">
                    <input type="text" readonly id="node-link" value="vless://9bc70c95-353d-498a-b8d6-df76fbb5cd21@saas.sin.fan:2087?alpn=h2%2Chttp%2F1.1&ech=AGH%2BDQBdAAAgACBU7e8e%2FSzrzFSOoQa7OJLH%2B3bU9eXwXljHWIRzvycHA&encryption=none&fp=chrome&host=hk.ainio.cc.cd&path=%2Findex&security=tls&sni=hk.ainio.cc.cd&type=ws#HK-CF-ECH%20%7C%20%E8%87%AA%E5%8A%A8%E4%BC%98%E9%80%89" 
                           class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 pr-24 text-xs font-mono text-slate-300 focus:outline-none focus:border-emerald-500 transition-colors truncate">
                    <button onclick="copyLink()" class="absolute right-1.5 top-1.5 bottom-1.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg text-xs transition-colors flex items-center gap-1.5 shadow-lg shadow-emerald-500/20">
                        <i class="fa-regular fa-copy"></i>
                        <span>复制</span>
                    </button>
                </div>
            </div>

            <!-- QR Code Section (Collapsible / Toggle) -->
            <div class="pt-2 border-t border-slate-700/50 flex flex-col items-center gap-3">
                <button onclick="toggleQR()" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-qrcode"></i>
                    <span id="qr-btn-text">显示扫码导入二维码</span>
                </button>
                
                <div id="qr-container" class="hidden flex-col items-center bg-white p-3 rounded-xl shadow-lg mt-2">
                    <div id="qrcode"></div>
                    <p class="text-[10px] text-slate-600 mt-2 font-medium">使用 v2rayN / Shadowrocket 扫码导入</p>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-slate-500 space-y-1">
            <p>💡 本节点仅供学习交流与网络加速使用，请遵守当地法律法规。</p>
        </div>

    </div>

    <script>
        // Copy link logic
        function copyLink() {
            const copyText = document.getElementById("node-link");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);

            const status = document.getElementById("copy-status");
            status.classList.remove("hidden");
            setTimeout(() => {
                status.classList.add("hidden");
            }, 2000);
        }

        // QRCode generation & toggle logic
        let qrGenerated = false;
        function toggleQR() {
            const qrContainer = document.getElementById("qr-container");
            const btnText = document.getElementById("qr-btn-text");
            const nodeLink = document.getElementById("node-link").value;

            if (qrContainer.classList.contains("hidden")) {
                qrContainer.classList.remove("hidden");
                qrContainer.classList.add("flex");
                btnText.innerText = "隐藏二维码";

                if (!qrGenerated) {
                    new QRCode(document.getElementById("qrcode"), {
                        text: nodeLink,
                        width: 160,
                        height: 160,
                        colorDark : "#0f172a",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.L
                    });
                    qrGenerated = true;
                }
            } else {
                qrContainer.classList.add("hidden");
                qrContainer.classList.remove("flex");
                btnText.innerText = "显示扫码导入二维码";
            }
        }
    </script>
</body>
</html>
